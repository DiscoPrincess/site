name: Publish DiscoPrincess
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Analyze DiscoPrincess lyrics]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover opening videos
        run: python scripts/build_videos.py
      - name: Build pages using saved playlists and lyrics
        run: python scripts/build_site.py
      - name: Test pipeline helpers
        run: python -m unittest discover -s tests
      - name: Check player syntax
        run: node --check app.js
      - name: Prepare website
        run: |
          mkdir -p _site
          cp manifest.webmanifest sw.js offline.html index.html manifesto.html style.css app.js tracks.json playlists.json _site/
          cp -r playlists lyrics assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
