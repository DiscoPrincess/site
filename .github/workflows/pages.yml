name: Publish DiscoPrincess
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover opening videos
        run: python scripts/build_videos.py
      - name: Pull playlists and generate collection pages
        run: python scripts/refresh_tracks.py
      - uses: actions/cache@v4
        with:
          path: |
            .cache/lyrics
            ~/.cache/torch
            ~/.cache/pip
          key: lyric-align-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: lyric-align-v1-${{ runner.os }}-
      - name: Install CPU alignment dependencies
        run: |
          pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install 'numpy<3' soundfile
      - name: Build lyric timing and align entry playlist words
        run: python scripts/build_lyrics.py
      - name: Test playlist importer
        run: python -m unittest discover -s tests
      - name: Check player syntax
        run: node --check app.js
      - name: Prepare website
        run: |
          mkdir -p _site
          cp manifest.webmanifest sw.js offline.html index.html manifesto.html style.css app.js tracks.json playlists.json _site/
          cp -r playlists _site/playlists
          cp -r lyrics _site/lyrics
          cp -r assets _site/assets
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

